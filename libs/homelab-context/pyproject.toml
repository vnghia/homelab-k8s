[project]
name = "homelab-context"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",

    # Workspace
    "homelab-common",
    "homelab-types",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.BaseModel".msg = "Use homelab_types.BaseModel instead"
"pydantic.RootModel".msg = "Use homelab_types.RootModel instead"
