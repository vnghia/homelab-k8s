[project]
name = "homelab-pulumi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "orjson>=3.11.9",
    "pulumi>=3.247.0",
    "yaml-rs>=0.1.4",

    # Workspace
    "homelab-context",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"
