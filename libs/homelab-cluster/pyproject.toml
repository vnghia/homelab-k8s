[project]
name = "homelab-cluster"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.247.0",
    "pulumi-kubernetes>=4.30.0",

    # Workspace
    "homelab-common",
    "homelab-context",
    "homelab-host",
    "homelab-kubernetes",
    "homelab-model",
    "homelab-pulumi",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"
