[project]
name = "homelab-cluster"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.247.0",
    "pulumiverse-talos>=0.8.0",
    "pulumi-tailscale>=0.27.1",

    # Workspace
    "homelab-common",
    "homelab-pulumi",
    "homelab-types",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"
