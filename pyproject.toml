[project]
name = "homelab"
version = "0.1.0"
description = "homelab"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.247.0",
    "pydantic>=2.13.4",

    # Workspace
    "homelab-config",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.1.0", "ruff>=0.15.18"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["nickel.*"]
ignore_missing_imports = true

[tool.uv.workspace]
members = ["libs/homelab-*"]

[tool.uv.sources]
homelab-common = { workspace = true }
homelab-config = { workspace = true }
homelab-types = { workspace = true }

[tool.ty.rules]
all = "error"

[tool.ty.environment]
root = [
    "./src",
    "./libs/homelab-common/src",
    "./libs/homelab-config/src",
    "./libs/homelab-types/src",
]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "C4",
    "I",
    "ISC",
    "PIE",
    "PERF",
    "F",
    "PL",
    "PYI",
    "FURB",
    "Q",
    "RET",
    "SIM",
    "TID251",
    "T20",
    "RUF",
    "S",
]
ignore = [
    "ANN401",
    "PLC0414",
    "PLR0913",
    "RUF012",
    "S603",
    "S610",
    "PLR0911",
    "PLC0415",
    "S104",
]
preview = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.BaseModel".msg = "Use homelab_types.BaseModel instead"
