[project]
name = "homelab-k8s"
version = "0.1.0"
description = "homelab-k8s"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pulumi>=3.247.0"]

[dependency-groups]
dev = ["mypy>=2.1.0", "ruff>=0.15.18"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv.workspace]
members = ["libs/homelab-common", "libs/homelab-types"]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "C4",
    "I",
    "ISC",
    "PIE",
    "PERF",
    "F",
    "PL",
    "FURB",
    "Q",
    "RET",
    "SIM",
    "TID251",
    "T20",
    "RUF",
    "S",
]
ignore = [
    "ANN401",
    "PLC0414",
    "PLR0913",
    "RUF012",
    "S603",
    "S610",
    "PLR0911",
    "PLC0415",
    "S104",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.BaseModel".msg = "Use homelab_types.BaseModel instead"
