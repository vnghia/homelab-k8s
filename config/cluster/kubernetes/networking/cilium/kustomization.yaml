apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    releaseName: cilium
    # renovate: datasource=github-releases packageName=cilium/cilium
    version: "1.19.5"
    namespace: __CILIUM_NAMESPACE__
    valuesInline:
      bpf:
        hostLegacyRouting: false
        masquerade: true
      cgroup:
        autoMount:
          enabled: false
        hostRoot: /sys/fs/cgroup
      gatewayAPI:
        enabled: true
        enableAlpn: true
        enableAppProtocol: true
      ipam:
        mode: kubernetes
      kubeProxyReplacement: true
      k8sServiceHost: localhost
      k8sServicePort: 7445
      operator:
        replicas: 1
      securityContext:
        capabilities:
          ciliumAgent:
            - CHOWN
            - KILL
            - NET_ADMIN
            - NET_RAW
            - IPC_LOCK
            - SYS_ADMIN
            - SYS_RESOURCE
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
          cleanCiliumState:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_RESOURCE
replacements:
  - sourceValue: "#ref:pulumi/secrets:str:cluster.kubernetes.networking.cilium.cilium-ca.ca.crt"
    targets:
      - select:
          name: cilium-ca
          kind: Secret
        fieldPaths:
          - data.[ca.crt]
  - sourceValue: "#ref:pulumi/secrets:str:cluster.kubernetes.networking.cilium.cilium-ca.ca.key"
    targets:
      - select:
          name: cilium-ca
          kind: Secret
        fieldPaths:
          - data.[ca.key]
  - sourceValue: "#ref:pulumi/secrets:str:cluster.kubernetes.networking.cilium.hubble-server-certs.ca.crt"
    targets:
      - select:
          name: hubble-server-certs
          kind: Secret
        fieldPaths:
          - data.[ca.crt]
  - sourceValue: "#ref:pulumi/secrets:str:cluster.kubernetes.networking.cilium.hubble-server-certs.tls.crt"
    targets:
      - select:
          name: hubble-server-certs
          kind: Secret
        fieldPaths:
          - data.[tls.crt]
  - sourceValue: "#ref:pulumi/secrets:str:cluster.kubernetes.networking.cilium.hubble-server-certs.tls.key"
    targets:
      - select:
          name: hubble-server-certs
          kind: Secret
        fieldPaths:
          - data.[tls.key]
